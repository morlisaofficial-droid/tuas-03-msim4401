
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptocurrency Market</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    text-align: center;
    color: #2563eb;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #2563eb;
    color: white;
}

#status {
    margin-top: 15px;
    color: #555;
}
</style>
</head>

<body>

<div class="container">

<h1>Cryptocurrency Market</h1>

<p>Daftar harga mata uang kripto secara online.</p>

<button onclick="ambilData()">Perbarui Data</button>

<p id="status">Menghubungkan ke internet...</p>

<table>
<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Symbol</th>
<th>Price (USD)</th>
</tr>
</thead>

<tbody id="data">
</tbody>
</table>

</div>

<script>
async function ambilData() {

    const status = document.getElementById("status");
    const tabel = document.getElementById("data");

    status.innerHTML = "Mengambil data...";
    
    try {
        const url = "https://api.coinpaprika.com/v1/tickers?quotes=USD";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Gagal mengambil data");
        }

        const coins = await response.json();

        tabel.innerHTML = "";

        coins.slice(0, 10).forEach((coin, index) => {

            const harga = coin.quotes.USD.price;

            tabel.innerHTML += `
            <tr>
                <td>${coin.rank || index + 1}</td>
                <td>${coin.name}</td>
                <td>${coin.symbol}</td>
                <td>$${harga.toFixed(2)}</td>
            </tr>
            `;
        });

        status.innerHTML = "Data berhasil dimuat.";

    } catch (error) {
        status.innerHTML =
        "Data gagal dimuat. Periksa koneksi internet dan coba lagi.";
    }
}

ambilData();
</script>

</body>
</html>
